# cargo-deny configuration
#
# Replaces cargo-audit on the CI gate. cargo-deny covers a broader supply-chain
# surface: vulnerability advisories, license compliance, source allowlists,
# banned-crate enforcement.
#
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Both ignores below reach the project only via `axum-test`, which is a
# [dev-dependencies] crate used by the integration test suite. The released
# `jellyfin-exporter` binary and its container image do NOT link against
# any of these vulnerable versions; impact on production users is zero.
# Re-verify on each axum-test release.
#
# RUSTSEC-2026-0009 (time stack-exhaustion DoS) was RESOLVED 2026-08-25, not
# suppressed: the MSRV was raised 1.85 -> 1.88 so the patched time >= 0.3.47
# could be taken. The edition-2024 resolver had been correctly refusing it while
# the declared rust-version said 1.85.
#
# - RUSTSEC-2026-0097: rand unsoundness when a custom logger calls rand::rng()
#   with all the advisory's preconditions met, via
#   axum-test -> rust-multipart-rfc7578_2 -> rand. Dev-dependency only.
#
#   DO NOT REMOVE THIS on the strength of a local cargo-deny run. It was removed
#   on 2026-08-25 because a local check reported `advisory-not-detected`, and CI
#   promptly failed with `error[unsound]: Rand is unsound...`. Local cargo-deny
#   version and advisory-DB snapshot differ from CI's (pinned cargo-deny@0.18
#   with a freshly fetched DB), so "not detected here" proves nothing about
#   there. Verify against CI, not the laptop.
ignore = ["RUSTSEC-2026-0097"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
# `prometheus 0.14` pulls `protobuf 3.x` which depends on `thiserror 1.x`,
# while we use `thiserror 2.x` directly. Both are proc-macro-only with zero
# runtime cost, but cargo-deny flags the duplicate. Fix lands upstream when
# the prometheus crate bumps to thiserror 2; until then, skip.
multiple-versions = "warn"
skip = [
    { name = "thiserror", version = "=1.0.69" },
    { name = "thiserror-impl", version = "=1.0.69" },
]
